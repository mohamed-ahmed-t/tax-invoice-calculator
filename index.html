<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax & Invoice Calculator</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
      --accent-green: #059669;
      --accent-red: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #111827;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--text-main);
    }

    input, select {
      width: 100%;
      padding: 0.625rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .input-mode-group {
      display: flex;
      gap: 0.5rem;
    }

    .input-mode-group input {
      flex: 1;
    }

    .input-mode-group select {
      width: auto;
      min-width: 80px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      padding: 0.625rem 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.95rem;
    }

    .receipt-row:last-child {
      border-bottom: none;
    }

    .receipt-row.total {
      border-top: 2px solid var(--text-main);
      border-bottom: double 4px var(--text-main);
      font-weight: 700;
      font-size: 1.15rem;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
    }

    .discount-text {
      color: var(--accent-red);
    }

    .tax-text {
      color: var(--accent-green);
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.4rem;
      font-size: 0.75rem;
      border-radius: 4px;
      background: var(--bg-color);
      color: var(--text-muted);
      margin-left: 0.25rem;
    }

    .copy-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.625rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .copy-btn:hover {
      background-color: var(--primary-hover);
    }

    .code-box {
      background: #1e293b;
      color: #f8fafc;
      padding: 1rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tax & Invoice Calculator</h1>
    <p>Calculate unit pricing, flexible discounts, and taxes seamlessly</p>
  </header>

  <main class="container">
    <!-- Calculator Form -->
    <section class="card">
      <h2 class="card-title">Invoice Inputs</h2>
      
      <div class="form-group">
        <label for="quantity">Quantity (Q)</label>
        <input type="number" id="quantity" value="5" min="1" step="1">
      </div>

      <div class="form-group">
        <label for="price">Unit Price (P)</label>
        <input type="number" id="price" value="100" min="0" step="0.01">
      </div>

      <div class="form-group">
        <label for="discount">Discount (D)</label>
        <div class="input-mode-group">
          <input type="number" id="discount" value="10" min="0" step="0.01">
          <select id="discountType">
            <option value="%">%</option>
            <option value="flat">Flat ($)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="tax">Tax / VAT</label>
        <div class="input-mode-group">
          <input type="number" id="tax" value="14" min="0" step="0.01">
          <select id="taxType">
            <option value="%">%</option>
            <option value="flat">Flat ($)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Visual Summary / Receipt -->
    <section class="card">
      <h2 class="card-title">Calculated Summary</h2>
      
      <div id="receipt">
        <div class="receipt-row">
          <span>Gross Subtotal</span>
          <span id="resGross">$0.00</span>
        </div>
        <div class="receipt-row discount-text">
          <span>Discount <span id="resDiscBadge" class="badge">-</span></span>
          <span id="resDisc">-$0.00</span>
        </div>
        <div class="receipt-row">
          <span>Net Taxable Amount</span>
          <span id="resNet">$0.00</span>
        </div>
        <div class="receipt-row tax-text">
          <span>Tax Amount <span id="resTaxBadge" class="badge">-</span></span>
          <span id="resTax">+$0.00</span>
        </div>
        <div class="receipt-row total">
          <span>Grand Total</span>
          <span id="resTotal">$0.00</span>
        </div>
      </div>

      <!-- Quick Console Snippet Generator -->
      <div class="code-box" id="consoleCode">
        // Live console expression:
        calculateInvoice(5, 100, "10%", "14%");
      </div>
      <button class="copy-btn" id="copyBtn">Copy Function Code for Console</button>
    </section>
  </main>

  <script>
    // Core Logic Engine
    function calculateInvoice(Q, P, discount = 0, tax = 0) {
      const grossSubtotal = Q * P;

      // Calculate Discount
      let discountAmount = 0;
      let discountLabel = "0";
      if (typeof discount === "string" && discount.trim().endsWith("%")) {
        const rate = parseFloat(discount) || 0;
        discountAmount = grossSubtotal * (rate / 100);
        discountLabel = `${rate}%`;
      } else {
        discountAmount = parseFloat(discount) || 0;
        discountLabel = `Flat ${discountAmount.toFixed(2)}`;
      }

      const netTaxable = Math.max(0, grossSubtotal - discountAmount);

      // Calculate Tax
      let vatAmount = 0;
      let taxLabel = "0";
      if (typeof tax === "string" && tax.trim().endsWith("%")) {
        const rate = parseFloat(tax) || 0;
        vatAmount = netTaxable * (rate / 100);
        taxLabel = `${rate}%`;
      } else {
        vatAmount = parseFloat(tax) || 0;
        taxLabel = `Flat ${vatAmount.toFixed(2)}`;
      }

      const grandTotal = netTaxable + vatAmount;

      return {
        quantity: Q,
        unitPrice: P,
        grossSubtotal,
        discountApplied: discountLabel,
        discountAmount,
        netTaxable,
        taxApplied: taxLabel,
        vatAmount,
        grandTotal
      };
    }

    // UI Binding & Real-time Update
    const inputs = ['quantity', 'price', 'discount', 'discountType', 'tax', 'taxType'];
    
    function updateUI() {
      const Q = parseFloat(document.getElementById('quantity').value) || 0;
      const P = parseFloat(document.getElementById('price').value) || 0;
      
      const rawDisc = parseFloat(document.getElementById('discount').value) || 0;
      const discType = document.getElementById('discountType').value;
      const discountParam = discType === '%' ? `${rawDisc}%` : rawDisc;

      const rawTax = parseFloat(document.getElementById('tax').value) || 0;
      const taxType = document.getElementById('taxType').value;
      const taxParam = taxType === '%' ? `${rawTax}%` : rawTax;

      const data = calculateInvoice(Q, P, discountParam, taxParam);

      // Render Results
      const fmt = (num) => '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      
      document.getElementById('resGross').innerText = fmt(data.grossSubtotal);
      document.getElementById('resDisc').innerText = `-${fmt(data.discountAmount)}`;
      document.getElementById('resDiscBadge').innerText = data.discountApplied;
      document.getElementById('resNet').innerText = fmt(data.netTaxable);
      document.getElementById('resTax').innerText = `+${fmt(data.vatAmount)}`;
      document.getElementById('resTaxBadge').innerText = data.taxApplied;
      document.getElementById('resTotal').innerText = fmt(data.grandTotal);

      // Render Code Box
      const discArg = discType === '%' ? `"${rawDisc}%"` : rawDisc;
      const taxArg = taxType === '%' ? `"${rawTax}%"` : rawTax;
      document.getElementById('consoleCode').innerText = `calculateInvoice(${Q}, ${P}, ${discArg}, ${taxArg});`;
    }

    // Event Listeners for real-time calculation
    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', updateUI);
      document.getElementById(id).addEventListener('change', updateUI);
    });

    // Copy snippet button functionality
    document.getElementById('copyBtn').addEventListener('click', () => {
      const functionString = calculateInvoice.toString();
      navigator.clipboard.writeText(functionString).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = "Copied Function to Clipboard!";
        setTimeout(() => btn.innerText = "Copy Function Code for Console", 2000);
      });
    });

    // Initial render
    updateUI();
  </script>
</body>
</html>
